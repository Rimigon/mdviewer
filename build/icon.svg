<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- фон: скруглённый квадрат на всю канву (без прозрачных полей — не обрезается в таскбаре/заголовке) -->
  <rect width="512" height="512" rx="96" fill="#0969da"/>
  <!-- страница документа в безопасной зоне -->
  <rect x="132" y="96" width="248" height="320" rx="32" fill="#ffffff"/>
  <!-- символ Markdown: решётка #, симметрично относительно центра 256 -->
  <rect x="196" y="156" width="30" height="152" rx="12" fill="#0969da"/>
  <rect x="286" y="156" width="30" height="152" rx="12" fill="#0969da"/>
  <rect x="160" y="206" width="192" height="30" rx="12" fill="#0969da"/>
  <rect x="160" y="266" width="192" height="30" rx="12" fill="#0969da"/>
  <!-- строки тела документа -->
  <rect x="160" y="356" width="136" height="16" rx="8" fill="#d0d7de"/>
  <rect x="160" y="384" width="92" height="16" rx="8" fill="#d0d7de"/>
</svg>
