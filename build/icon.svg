<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- фон: скруглённый квадрат, фирменный GitHub-синий (плоский, без градиента) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0969da"/>
  <!-- страница документа -->
  <rect x="104" y="88" width="304" height="336" rx="36" fill="#ffffff"/>
  <!-- символ Markdown: решётка # (симметрично относительно центра 256) -->
  <rect x="192" y="140" width="28" height="144" rx="10" fill="#0969da"/>
  <rect x="292" y="140" width="28" height="144" rx="10" fill="#0969da"/>
  <rect x="148" y="184" width="216" height="28" rx="10" fill="#0969da"/>
  <rect x="148" y="252" width="216" height="28" rx="10" fill="#0969da"/>
  <!-- строки тела документа -->
  <rect x="148" y="350" width="150" height="14" rx="7" fill="#d0d7de"/>
  <rect x="148" y="382" width="104" height="14" rx="7" fill="#d0d7de"/>
</svg>
